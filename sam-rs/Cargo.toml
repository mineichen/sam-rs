[package]
name = "sam-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
burn.workspace = true
image = "0.25.8"
pyo3 = { version = "0.26.0", features = ["auto-initialize"], optional = true }
serde = { version = "1.0.200", features = ["derive"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

[dev-dependencies]
sam-rs = { path = ".", features = ["pyo3"] }
tempfile = "3.14.0"
burn-ndarray.workspace = true
ndarray = "0.16.1"

[features]
default = []
pyo3 = ["dep:pyo3"]
