[package]
name = "sam-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
burn.workspace = true
image = "0.25.9"
pyo3 = { version = "0.28.2", features = ["auto-initialize"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
burn-ndarray.workspace = true
sam-rs = { path = ".", features = ["pyo3"] }
tempfile = "3.25.0"
ndarray = "0.17.2"

[[example]]
name = "predict"

[features]
default = []
pyo3 = ["dep:pyo3"]
